<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#02040b">
  <title>Solo Leveling</title>

  <!-- Appli installable : icône, plein écran, fonctionne hors connexion (voir sw.js) -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Système">

  <!-- Polices : Chakra Petch (titres), Rajdhani (texte), + celles des thèmes du Studio.
       Sans internet, des polices système prennent le relais. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Rajdhani:wght@500;600;700&family=Space+Grotesk:wght@500;700&family=Inter:wght@500;700&family=IBM+Plex+Sans:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/system.css">
  <link rel="stylesheet" href="css/views.css">
  <link rel="stylesheet" href="css/learn.css">
  <link rel="stylesheet" href="css/deck.css">
  <link rel="stylesheet" href="css/code.css">
  <link rel="stylesheet" href="css/shell.css">
</head>

<body>

  <!-- Icônes de la navigation (réutilisées avec <use>) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-statut" viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 8v4l3 2"/></symbol>
      <symbol id="i-quetes" viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"/><path d="M8.5 12.5l2 2 4-4.5"/></symbol>
      <symbol id="i-planning" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="1"/><path d="M4 10h16M9 3v4M15 3v4"/></symbol>
      <symbol id="i-alertes" viewBox="0 0 24 24"><path d="M6 17v-6a6 6 0 1112 0v6l1.5 2h-15z"/><path d="M10 21h4"/></symbol>
      <symbol id="i-projets" viewBox="0 0 24 24"><path d="M4 7h6l2 2h8v10H4z"/></symbol>
      <symbol id="i-sport" viewBox="0 0 24 24"><path d="M3 9v6M6 7v10M18 7v10M21 9v6M6 12h12"/></symbol>
      <symbol id="i-code" viewBox="0 0 24 24"><path d="M9 4L3 12l6 8"/><path d="M15 4l6 8-6 8"/></symbol>
      <symbol id="i-apprendre" viewBox="0 0 24 24"><path d="M4 5.5C7 4 10 4.3 12 6c2-1.7 5-2 8-.5V19c-3-1.5-6-1.2-8 .5-2-1.7-5-2-8-.5z"/><path d="M12 6v13.5"/></symbol>
      <symbol id="i-studio" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="1"/><path d="M12 16v4M8 20h8M8 12l3-3 2 2 3-4"/></symbol>
      <symbol id="i-reglages" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></symbol>
    </defs>
  </svg>

  <!-- Fond animé et effets -->
  <canvas id="bg" aria-hidden="true"></canvas>
  <div class="scanlines" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <!-- Écran de démarrage (disparaît seul) -->
  <div id="boot" class="boot" aria-hidden="true">
    <div class="boot-box">
      <span>SYSTÈME EN LIGNE</span>
      <i></i>
      <small>Chargement du Joueur...</small>
    </div>
  </div>


  <div class="shell">

    <!-- ===== Barre latérale (ordinateur) ===== -->
    <aside class="side">
      <div class="emblem">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <circle cx="60" cy="60" r="52" class="em-bg"/>
          <circle cx="60" cy="60" r="52" class="em-fg js-ring" transform="rotate(-90 60 60)"/>
        </svg>
        <div class="em-text"><small>NIV.</small><b class="js-level-num">1</b></div>
      </div>

      <div class="side-id">
        <strong class="js-name">Joueur</strong>
        <small class="js-rank">RANG E</small>
      </div>

      <div class="side-xp">
        <div class="bar"><i class="js-bar"></i></div>
        <small class="js-xp"></small>
      </div>

      <!-- ===== Navigation : une entrée par page (voir VIEWS dans js/main.js) ===== -->
      <nav id="nav" aria-label="Navigation principale">
        <a href="#statut"    data-view="statut">   <svg><use href="#i-statut"/></svg><span>Statut</span></a>
        <a href="#quetes"    data-view="quetes">   <svg><use href="#i-quetes"/></svg><span>Quêtes</span></a>
        <a href="#planning"  data-view="planning"> <svg><use href="#i-planning"/></svg><span>Planning</span></a>
        <a href="#alertes"   data-view="alertes">  <svg><use href="#i-alertes"/></svg><span>Alertes</span></a>
        <a href="#projets"   data-view="projets">  <svg><use href="#i-projets"/></svg><span>Projets</span></a>
        <a href="#sport"     data-view="sport">    <svg><use href="#i-sport"/></svg><span>Sport</span></a>
        <a href="#code"      data-view="code">     <svg><use href="#i-code"/></svg><span>Code</span></a>
        <a href="#apprendre" data-view="apprendre"><svg><use href="#i-apprendre"/></svg><span>Apprendre</span></a>
        <a href="#studio"    data-view="studio">   <svg><use href="#i-studio"/></svg><span>Studio</span></a>
        <a href="#reglages"  data-view="reglages"> <svg><use href="#i-reglages"/></svg><span>Réglages</span></a>
      </nav>

      <div class="side-foot">
        <button class="hud-btn bell js-bell" type="button" aria-label="Quêtes restantes">!</button>
        <button class="hud-btn js-sound" type="button" aria-label="Activer ou couper le son" aria-pressed="true">♪</button>
      </div>
    </aside>


    <div class="content">

      <!-- ===== Barre du haut (téléphone) ===== -->
      <header class="mobilebar">
        <span class="logo">[ SYSTÈME ]</span>
        <span class="mb-level js-level-text">NIV. 1</span>
        <div class="mb-xp"><div class="bar"><i class="js-bar"></i></div></div>
        <button class="hud-btn bell js-bell" type="button" aria-label="Quêtes restantes">!</button>
        <button class="hud-btn js-sound" type="button" aria-label="Activer ou couper le son" aria-pressed="true">♪</button>
      </header>

      <!-- Titre de la page -->
      <div class="pagehead">
        <h1 id="pageTitle" class="glitch" data-text="Statut">Statut</h1>
        <p id="pageSub"></p>
      </div>

      <!-- ===== Contenu de la page courante (rempli par js/*.js) ===== -->
      <main id="view" class="app"></main>
    </div>

  </div>


  <!-- ===== Fenêtres du Système ===== -->
  <div id="notifs" aria-live="assertive"></div>
  <div id="modal"></div>
  <div id="toasts" aria-live="polite"></div>


  <!-- Scripts : l'ordre compte (données -> outils -> pages -> démarrage) -->
  <script src="js/content/culture.js"></script>
  <script src="js/content/cyber.js"></script>
  <script src="js/content/kali.js"></script>
  <script src="js/content/python.js"></script>
  <script src="js/content/english.js"></script>
  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/store.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/xp.js"></script>
  <script src="js/quests.js"></script>
  <script src="js/planner.js"></script>
  <script src="js/alerts.js"></script>
  <script src="js/projects.js"></script>
  <script src="js/sport.js"></script>
  <script src="js/code.js"></script>
  <script src="js/learn-engine.js"></script>
  <script src="js/learn.js"></script>
  <script src="js/studio-data.js"></script>
  <script src="js/studio-render.js"></script>
  <script src="js/studio-export.js"></script>
  <script src="js/studio.js"></script>
  <script src="js/status.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/background.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
